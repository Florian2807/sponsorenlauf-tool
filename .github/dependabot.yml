version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # eslint-config-next currently pulls eslint-plugin-react, whose peer range
      # does not support ESLint 10 yet. Remove this once that stack is compatible.
      - dependency-name: eslint
        versions: [">=10"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
