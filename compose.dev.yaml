name: sponsorenlauf-dev

services:
  app:
    build:
      context: .
      target: development
    environment:
      APP_ENV: development
      NODE_ENV: development
      SPONSORENLAUF_RUNTIME: development
      SPONSORENLAUF_DATABASE_BACKEND: postgres
      PGHOST: database
      PGUSER: postgres
      PGPASSWORD: development-only
      PGDATABASE: sponsorenlauf_dev
      SPONSORENLAUF_DATABASE_PATH: /data/development.db
      SPONSORENLAUF_BACKUP_DIRECTORY: /data/backups
      SPONSORENLAUF_SECRET_KEY: development-only-secret
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - dev-data:/data

  database:
    image: postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_PASSWORD: development-only
      POSTGRES_DB: sponsorenlauf_dev
    volumes:
      - dev-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sponsorenlauf_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  dev-postgres:
  dev-node-modules:
    name: sponsorenlauf-dev-node-modules
  dev-data:
    name: sponsorenlauf-dev-data
